apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agripulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: agripulse/gateway:1.0
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: agripulse-config
        - secretRef:
            name: agripulse-secret
        env:
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: EUREKA_INSTANCE_IP_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agripulse
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 5000
    targetPort: 5000
