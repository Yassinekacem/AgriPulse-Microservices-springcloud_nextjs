spring.application.name=ConfigServer
server.port=9999

spring.cloud.config.server.git.uri=https://github.com/Yassinekacem/ConfigServer.git

eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:4040}/eureka

management.endpoints.web.exposure.include=refresh
