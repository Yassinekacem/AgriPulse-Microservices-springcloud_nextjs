spring.application.name=Gateway
server.port=5000

# IMPORTANT: ne jamais mettre spring.cloud.config.uri=localhost ici
spring.config.import=optional:configserver:http://configserver:9999


eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:4040}/eureka

management.endpoints.web.exposure.include=gateway
