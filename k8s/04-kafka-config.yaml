apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: agripulse
data:
  server.properties: |
    # --- KRaft (pas de ZooKeeper) ---
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@kafka:9093
    controller.listener.names=CONTROLLER

    # --- Listeners ---
    listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT

    # --- Storage (IMPORTANT pour PVC) ---
    log.dirs=/var/lib/kafka/data

    # --- Single broker ---
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
