apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: agripulse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: agripulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.2
        ports:
        - containerPort: 9092
        - containerPort: 9093
        - containerPort: 19092
        env:
        - name: CLUSTER_ID
          value: "5L6g3nShT-eMCtK--X86sw"
        args:
        - bash
        - -lc
        - |
          set -e
          DATA_DIR="/var/lib/kafka/data"
          CONFIG="/mnt/config/server.properties"

          if [ ! -f "${DATA_DIR}/meta.properties" ]; then
            echo "Formatting KRaft storage (first run)..."
            /opt/kafka/bin/kafka-storage.sh format -t "${CLUSTER_ID}" -c "${CONFIG}" --ignore-formatted
          else
            echo "meta.properties already exists, skipping format."
          fi

          exec /opt/kafka/bin/kafka-server-start.sh "${CONFIG}"
        volumeMounts:
        - name: kafka-config
          mountPath: /mnt/config/server.properties
          subPath: server.properties
        - name: kafka-data
          mountPath: /var/lib/kafka/data
      volumes:
      - name: kafka-config
        configMap:
          name: kafka-config
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: agripulse
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
